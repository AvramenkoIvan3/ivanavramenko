<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Форма — Управління соціальною сферою</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Форма зворотного зв'язку</h1>
    <nav>
        <a href="index.html">Головна</a>
        <a href="about.html">Про напрям</a>
        <a href="practice.html">Практика</a>
        <a href="contact.html">Форма</a>
        <a href="info_block.html">Блокова сторінка</a>
    </nav>
</header>
<main class="container">
    <form action="#" method="post">
        <fieldset>
            <legend>Зв'язок з адміністрацією</legend>
            <label>Ім'я:<br><input type="text" name="name" placeholder="Ваше ім'я" required></label><br><br>
            <label>Email:<br><input type="email" name="email" placeholder="email@example.com" required></label><br><br>
            <label>Повідомлення:<br><textarea name="message" rows="5" cols="30" placeholder="Ваше повідомлення" required></textarea></label><br><br>
            <fieldset>
                <legend>Ваші інтереси</legend>
                <label><input type="checkbox" name="interest1" value="social"> Соціальні проекти</label><br>
                <label><input type="checkbox" name="interest2" value="education"> Освіта</label><br>
                <label><input type="checkbox" name="interest3" value="community"> Громада</label><br>
            </fieldset><br>
            <label>Стать:<br>
                <input type="radio" name="gender" value="male" checked> Чоловіча<br>
                <input type="radio" name="gender" value="female"> Жіноча
            </label><br><br>
            <input type="submit" value="Відправити">
            <input type="reset" value="Очистити">
        </fieldset>
    </form>
</main>
